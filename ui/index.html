<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f15" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Valve Oil UI</title>
    <script>
      // Apply the saved theme before first paint. Valve Oil's brand is dark; light is a choice that's remembered.
      let dark = true
      try {
        dark = localStorage.getItem('vo-theme') !== 'light'
      } catch {}
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
