    file: /home/qidi/klipper/klippy/extras/box_config.py
    restart_service: klipper.service
  klipper_print_stats_manager:
    file: /home/qidi/klipper/klippy/extras/print_stats_manager.py
    restart_service: klipper.service
  fluidd_filament_config:
    link: config/qidi_filament_config
    target: /home/qidi/QIDI_Client/resource/filament_config
  rockchip_root_sync:
    id: rockchip_root_sync
    unit: rockchip.service
    unit_file: /lib/systemd/system/rockchip.service
    script: /etc/init.d/rockchip.sh
    dropin: /etc/systemd/system/rockchip.service.d/override.conf
    dropin_content: |
      [Service]
      ExecStart=
      ExecStart=/bin/true
    mount_target: /
    vendor_exec_start: /etc/init.d/rockchip.sh
    desired_exec_start: /bin/true
    defective_unit_markers:
      - ExecStart=/etc/init.d/rockchip.sh
    defective_script_markers:
      - "#!/bin/bash -e"
      - rk3308
      - 'CHIPNAME="rk3208"'
      - mount -o remount,sync /
      - install_packages
      - touch /usr/local/first_boot_flag
    ordered_script_markers:
      - mount -o remount,sync /
      - install_packages
      - touch /usr/local/first_boot_flag

