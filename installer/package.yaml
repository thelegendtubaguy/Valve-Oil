# Installer manifest for staged optimized-macro install and guarded stock-value patches.

schema_version: 1

package:
  # The id predates multi-printer support; installed state records it, so it stays.
  id: qidi-max4-optimized
  display_name: Valve Oil
  version: "26.11.10.3"
# Each firmware version belongs to exactly one printer; patch variants are keyed by firmware version.
printers:
  - id: max4
    display_name: QIDI Max 4
    soc_file_prefix: QD_MAX4_SOC_
    stock_snapshots: stock/qidi-max4-defaults/firmwares
    macros: klipper/printers/max4
    firmware:
      - "01.01.06.03"
      - "01.01.06.04"
      - "01.01.06.05"
      - "01.01.07.01"

backup:
  source_directory: "config"
  label_prefix: "tltg-optimized-macros-before-optimize"

state:
  record_file: "config/tltg_optimized_state.yaml"

preflight:
  required_files:
    - "config/printer.cfg"
    - "config/klipper-macros-qd/bed_mesh.cfg"
    - "config/klipper-macros-qd/filament.cfg"
    - "config/klipper-macros-qd/kinematics.cfg"
    - "config/klipper-macros-qd/start_end.cfg"

  required_sections:
    - file: "config/printer.cfg"
      section: "save_variables"
    - file: "config/klipper-macros-qd/bed_mesh.cfg"
      section: "gcode_macro g29"
    - file: "config/klipper-macros-qd/start_end.cfg"
      section: "gcode_macro print_start"

  required_lines:
    - file: "config/printer.cfg"
      line: "[include klipper-macros-qd/*.cfg]"

install:
  ensure_directories:
    - "config/tltg-optimized-macros"

  # The common macros install together with the detected printer's `macros` folder; the two may not share a file.
  managed_tree:
    id: optimized_macro_tree
    source: "klipper/tltg-optimized-macros"
    destination: "config/tltg-optimized-macros"
    mode: mirror
    required_files:
      - "homing.cfg"
      - "nozzle_motion.cfg"
      - "printer_profile.cfg"
      - "bed_mesh.cfg"
      - "cancel.cfg"
      - "cooling.cfg"
      - "filament.cfg"
      - "globals.cfg"
      - "heaters.cfg"
      - "helpers.cfg"
      - "kinematics.cfg"
      - "motion.cfg"
      - "offset.cfg"
      - "start_end.cfg"
      - "temperatures.cfg"
      - "box_link_monitor.cfg"
      - "box_mcu_temperature.cfg"
      - "background_save_config.cfg"
      - "box_heater_refresh.cfg"
      - "klipper_health.cfg"
      - "save_variables_fast.cfg"
      - "box_feed_motion.cfg"
      - "box_eject.cfg"
      - "box_filament_guard.cfg"
      - "box_loaded_slot.cfg"
      - "box_slot_jog.cfg"
      - "box_rfid.cfg"
      - "box_flow_recovery.cfg"
      - "cold_cut.cfg"
      - "box485_monitor.cfg"
      - "spoolman.cfg"
      - "macro_status.cfg"
      - "klipper_fixes.cfg"
      - "input_shaper.cfg"
      - "printer_warnings.cfg"
      - "resonance_sweep.cfg"
      - "bed_soak.cfg"

  ensure_lines:
    - id: include_optimized_macros
      file: "config/printer.cfg"
      line: "[include tltg-optimized-macros/*.cfg]"
      after: "[include klipper-macros-qd/*.cfg]"

  extra_modules:
    - id: box_link_monitor
      source: "klipper/tltg/box_link_monitor.py"
      destination: "klippy/extras/tltg_box_link_monitor.py"
    - id: box_mcu_temperature
      source: "klipper/tltg/box_mcu_temperature.py"
      destination: "klippy/extras/tltg_box_mcu_temperature.py"
    - id: background_save_config
      source: "klipper/tltg/background_save_config.py"
      destination: "klippy/extras/tltg_background_save_config.py"
    - id: box_heater_refresh
      source: "klipper/tltg/box_heater_refresh.py"
      destination: "klippy/extras/tltg_box_heater_refresh.py"
    - id: klipper_health
      source: "klipper/tltg/klipper_health.py"
      destination: "klippy/extras/tltg_klipper_health.py"
    - id: macro_status
      source: "klipper/tltg/macro_status.py"
      destination: "klippy/extras/tltg_macro_status.py"
    - id: printer_warnings
