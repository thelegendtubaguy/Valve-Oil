        sha256: 5a6d04bcd42f19b25e93480764adc118864b99370a738776552b84591bece330
      - name: zram
        archive: system/zram/zram.ko
        sha256: 7183b7acaafde783dd1b7aa1ae97ecde69b785b1d48af4cb79320167080e559c
