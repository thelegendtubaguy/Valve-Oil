postflight:
  verify_lines:
    - file: "config/printer.cfg"
      line: "[include tltg-optimized-macros/*.cfg]"

system_optimizations:
  enabled_by_default: true
  dns:
    resolv_conf: /etc/resolv.conf
    resolvconf_head: /etc/resolvconf/resolv.conf.d/head
    resolvconf_tail: /etc/resolvconf/resolv.conf.d/tail
    target_symlink: /run/resolvconf/resolv.conf
    fallback_nameservers:
      - 1.1.1.1
      - 8.8.8.8
  apt_sources:
    file: /etc/apt/sources.list
    content: |
      deb http://deb.debian.org/debian bullseye main contrib
      deb-src http://deb.debian.org/debian bullseye main contrib
      deb http://security.debian.org/debian-security bullseye-security main contrib
      deb-src http://security.debian.org/debian-security bullseye-security main contrib
      deb http://deb.debian.org/debian bullseye-updates main contrib
      deb-src http://deb.debian.org/debian bullseye-updates main contrib
  services:
    disable:
      - xl2tpd
      - bluetooth
      # Rockchip USB gadget service; its only function is ADB, a root shell on TCP 5555 with no authentication.
      - usbdevice.service
    optional_disable:
      - id: algo_app
        service: algo_app.service
        prompt: Would you like us to disable QIDI AI detection features?
  qidiclient_static_gifs:
    archive: system/qidiclient-static-gifs.tar.gz
    sha256: 616c11226addbc09c9d4dc83b0e1d359f15e2f4c1d84c1d8bb008f841d616fce
    destination: /home/qidi/QIDI_Client/access
    restart_service: qidi-client.service
  moonraker_file_manager:
    file: /home/qidi/moonraker/moonraker/components/file_manager/file_manager.py
    restart_service: moonraker.service
  moonraker_metadata_3mf:
    file: /home/qidi/moonraker/moonraker/components/file_manager/metadata.py
    restart_service: moonraker.service
  fluidd_box_filament_ids:
    file: /home/qidi/fluidd/assets/index-DlFvHGAh.js
    service_worker: /home/qidi/fluidd/sw.js
  # The project's Fluidd fork release; the bundle builder downloads and verifies it.
  fluidd_build:
    version: v1.37.7-tltg-e9d5793
    url: https://github.com/thelegendtubaguy/fluidd/releases/download/v1.37.7-tltg-e9d5793/fluidd.zip
    archive: system/fluidd.zip
    sha256: 827f4292f3f50b6724d625501f7256fa08074fb1fba57f22d5a9bd4d0159f226
  # Valve Oil UI; the bundle builder builds it from source and adds the archive's sha256 to the bundled manifest.
  valve_oil_ui:
    source: ui
    archive: system/valve-oil-ui.zip
  # Wheels for QIDI's Moonraker virtualenv (Python 3.9, aarch64); the bundle builder downloads and verifies them.
  moonraker_speedups:
    wheels:
      - url: https://files.pythonhosted.org/packages/44/14/9d6f685a277e4d3417f103c4d228cb7ea83fdd776c739570f233917f5fd2/msgspec-0.20.0-cp39-cp39-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
