  # Compressed swap in RAM for QIDI's kernel, which ships without zram. The modules load only on these exact kernel
  # builds; scripts/build_kernel_modules.py rebuilds them from kernel/ and checks these hashes. The Plus 5's #3 differs
  # from the Max 4's #4 only in its build string and the bytes that string shifts, and the Smart 5's #15 from the
  # Plus 5's #3 only in its build string and build ID (kernel/README.md).
  zram_swap:
    kernel_release: 5.10.160
    kernel_versions:
      - "#4 SMP PREEMPT Wed Sep 3 15:21:57 CST 2025"
      - "#3 SMP PREEMPT Sat Aug 23 12:12:00 CST 2025"
      - "#15 SMP PREEMPT Fri Apr 3 15:46:16 CST 2026"
    modules:
      - name: lz4_compress
        archive: system/zram/lz4_compress.ko
        sha256: 6c1bfdc54fbde4bc6fefbffb8a67b50d56fc254abbdbc41b48d8e6c875482213
      - name: lz4_decompress
        archive: system/zram/lz4_decompress.ko
        sha256: 9dadc31be2afc4f9035eded5341b5be9c7867fcd6c7af57ad60a8cf8a76a5e4f
      - name: lz4
        archive: system/zram/lz4.ko
        sha256: 1d8f4610fad85b01269e02b340b7627cf9d782713341a24bd3d7bc546fda91a4
      - name: zsmalloc
        archive: system/zram/zsmalloc.ko
        sha256: 5a6d04bcd42f19b25e93480764adc118864b99370a738776552b84591bece330
      - name: zram
        archive: system/zram/zram.ko
        sha256: 7183b7acaafde783dd1b7aa1ae97ecde69b785b1d48af4cb79320167080e559c
    size_mb: 256
    algorithm: lz4
    swappiness: 80
    page_cluster: 0
