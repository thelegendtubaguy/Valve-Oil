# Installer manifest for staged optimized-macro install and guarded stock-value patches.

schema_version: 1

package:
  # The id predates multi-printer support; installed state records it, so it stays.
  id: qidi-max4-optimized
  display_name: Valve Oil
  version: "26.11.18.2"
# Each firmware version belongs to exactly one printer; patch variants are keyed by firmware version.
# target_firmware is the QIDI firmware this release brings the printer to: its newest listed firmware, downloaded only
# from this project's mirror release and checked against the archive's size and SHA-256. Every other listed firmware
# updates to it. Board versions come from each package's firmware_manifest.json, as listed in the mirror releases.
# restore_sets pin QIDI's update folder for each package of each listed firmware, without the system package: its
# firmware_manifest.json and the board images it names, read from the mirror release's archive. The USB drive image
# carries them, and the USB hand-off puts back the set for the installed firmware after QIDI's offline update empties
# the folder. A set is named by QIDI's version, with the package's date where QIDI published a version twice; the
# hand-off restores the latest.
printers:
  - id: max4
    display_name: QIDI Max 4
    soc_file_prefix: QD_MAX4_SOC_
    stock_snapshots: stock/qidi-max4-defaults/firmwares
    macros: klipper/printers/max4
    firmware:
      - "01.01.06.03"
      - "01.01.06.04"
      - "01.01.06.05"
      - "01.01.07.01"
    target_firmware:
      version: "01.01.07.01"
      mirror: thelegendtubaguy/Qidi-Max4-Defaults
      release: qidi-max4-firmware-01.01.07.01-0cc97445e77295116adaa665ff463e77608d4929520bd7cd46e732fbb0a6ecf2
      archive: QD_MAX4_01.01.07.01_20261016_Release.zip
      sha256: 0cc97445e77295116adaa665ff463e77608d4929520bd7cd46e732fbb0a6ecf2
      size: 264568499
      boards: {mcu: "02.01.01.12", thr: "02.02.01.08", box: "02.03.01.21", closed_loop: "03.01.10.15"}
      # QD_MAX4_CLOSED_LOOP_03.01.10.15_20260907.bin in the package, which the update sends to each X/Y driver.
      closed_loop_image: {size: 116736, sha256: d670e9104f4844d38669312104355837d4a92a06b03ed8157d487e87286b1be4}
      update_from:
        "01.01.06.03": {mcu: "02.01.01.11", thr: "02.02.01.08", box: "02.03.01.21", closed_loop: "03.01.10.13"}
        # QIDI published 01.01.06.04 twice: on 2026-06-09 with mainboard 02.01.01.11, then on 2026-06-12 with 02.01.01.12.
        "01.01.06.04": {mcu: ["02.01.01.11", "02.01.01.12"], thr: "02.02.01.08", box: "02.03.01.21", closed_loop: "03.01.10.13"}
        "01.01.06.05": {mcu: "02.01.01.12", thr: "02.02.01.08", box: "02.03.01.21", closed_loop: "03.01.10.13"}
    restore_sets:
