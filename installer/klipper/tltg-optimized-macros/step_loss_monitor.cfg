# X/Y step-loss monitor for QIDI's closed-loop X/Y drivers. Inert until the
# saved variable is present and truthy:
#   SAVE_VARIABLE VARIABLE=tltg_step_loss_monitor VALUE=1
# A slip during print start cancels the print, and one later in a print pauses
# it. With SAVE_VARIABLE VARIABLE=tltg_step_loss_recovery VALUE=1, the first
# slip after print start runs _TLTG_STEP_LOSS_RECOVER instead. See
# docs/tools.md.

[tltg_step_loss_monitor]

[gcode_macro _TLTG_STEP_LOSS_RECOVER]
description: Lifts the nozzle, corrects Klipper's X/Y position for a reported motor slip, and returns to the print.
gcode:
  # The print's next move starts from here, in G-code coordinates.
  {% set pos = printer.gcode_move.gcode_position %}
  {% set th = printer.toolhead %}
  {% set hop = [1.0, th.axis_maximum.z - th.position.z]|min %}
  {% set retract = 0.8 if printer[th.extruder].can_extrude else 0 %}
  SAVE_GCODE_STATE NAME=_tltg_step_loss_recover
  M83
  {% if retract > 0 %}
    G1 E-{retract} F1800
  {% endif %}
  G91
  {% if hop > 0 %}
    G1 Z{hop} F600
  {% endif %}
  TLTG_STEP_LOSS_CORRECT
  G90
  G1 X{pos.x} Y{pos.y} F6000
  RESTORE_GCODE_STATE NAME=_tltg_step_loss_recover MOVE=1 MOVE_SPEED=10
  {% if retract > 0 %}
    SAVE_GCODE_STATE NAME=_tltg_step_loss_unretract
    M83
    G1 E{retract} F1800
    RESTORE_GCODE_STATE NAME=_tltg_step_loss_unretract
  {% endif %}
