# Bed soak test: measures how long the bed takes to reach temperature and
# stop moving, at a bed and chamber temperature you choose. Run it from
# Fluidd's Tune page or with
#   TLTG_BED_SOAK BED=100 CHAMBER=60
# and stop it with TLTG_BED_SOAK_STOP. Runs are saved in the config folder's
# tltg_bed_soak folder. tltg_probe_report records which probe points of each
# bed mesh needed retries, for Fluidd's Bed mesh card. See docs/tools.md.

