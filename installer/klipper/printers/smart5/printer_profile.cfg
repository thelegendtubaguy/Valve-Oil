# QIDI Smart 5 positions and calibration defaults read by the common optimized macros.

[gcode_macro _tltg_printer]
description: QIDI Smart 5 positions and QIDI's stock input shaper calibration.
variable_bed_center_x: 90
variable_bed_center_y: 90
# Where print-start filament prep leaves the toolhead for the slicer's prime line, left of the front-right cutter.
variable_prime_line_staging_x: 110
variable_prime_line_staging_y: 5
# Where a QIDI Box print start waits for the bed before bed leveling. The Smart 5 has no Z tilt.
variable_z_tilt_staging_x: 90
variable_z_tilt_staging_y: 90
variable_default_shaper_type_x: "zv"
variable_default_shaper_freq_x: 68.6
variable_default_shaper_type_y: "mzv"
variable_default_shaper_freq_y: 49.4
gcode:

# Toolhead filament sensor on this printer's THR pin; runout and insert go through the common optimized macros.

[filament_switch_sensor filament_switch_sensor]
pause_on_runout: False
runout_gcode:
  OPTIMIZED_FILAMENT_SENSOR_RUNOUT
insert_gcode:
  OPTIMIZED_FILAMENT_SENSOR_INSERTED
event_delay: 3.0
pause_delay: 0.5
switch_pin: !THR:PA1
