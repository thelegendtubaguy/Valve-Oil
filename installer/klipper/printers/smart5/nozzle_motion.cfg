# QIDI Smart 5 cutter, waste chute, wiper, and rear-bed scrape moves, from QIDI's Smart 5 macros and slicer profiles.
# The cutter is at the front right; the chute is at the rear, at X100 Y199, with its wiper along Y180-Y199.

[gcode_macro CUT_FILAMENT_1]
description: QIDI's Smart 5 cut at the front-right cutter; leaves stock modal state for vendor callers.
gcode:
  _CG28
  M204 S10000
  {% if (printer.gcode_move.position.x) > 169 %}
    G1 X165 F9000
    G1 Y1 F9000
  {% endif %}
  G1 Y1 F5000
  G1 X175 F5000
  G1 X178 F60
  G1 X180 F60
  M400
  M83
  G1 E-4 F1000
  M400
  G4 P2000
  G1 X160 F3000
  M400

[gcode_macro MOVE_TO_TRASH]
description: Moves to the waste chute, fast and straight to the chute entrance at Y179 and then in; leaves stock modal state for vendor callers.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}

  G28 O X Y
  M204 S10000
  # Behind the bed the toolhead fits only around the chute, so it reaches the chute entrance before going in.
  {% if (printer.gcode_move.position.y) > km.print_max[1] %}
      {% if (printer.gcode_move.position.x) > 100 or (printer.gcode_move.position.x) < 80 %}
          # Leave the chute straight forward before crossing to the entrance.
          G1 Y{km.park_y - 20} F{km.travel_speed_xy}
          G1 X{km.park_x} F{km.travel_speed_xy}
          G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
      {% endif %}
      G1 X{km.park_x} Y{km.park_y} F{km.travel_speed_xy}
  {% else %}
      M204 S{opt.trash_travel_accel}
      G1 X{km.park_x} Y{km.park_y - 20} F{opt.trash_travel_speed_xy}
      M204 S10000
      G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
  {% endif %}

[gcode_macro _OPTIMIZED_REAR_BED_SCRAPE]
description: Probes the rear scrape strip and scrapes the nozzle just above it, as QIDI's Smart 5 nozzle clean does.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}

  OPTIMIZED_MOVE_TO_TRASH
  G90
  M204 S10000
  G1 X79 Y187 F12000
  G1 Z5 F480
  M400
  PROBE SAMPLES=1
  G91
  G1 Z0.1 F480
  G90
  G2 I0.5 J0.5 F600
  G2 I0.5 J0.5
  G2 I0.5 J0.5
  G91
  G1 Z1 F600
  G90
  G1 X85 Y185 F12000
  G91
  G1 Z-1 F600
  G90
  G1 X95 F200
  G1 Y186
  G1 X85
  G1 Y187
  G1 X95
  G2 I0.5 J0.5 F600
  G2 I0.5 J0.5
  G2 I0.5 J0.5
  G1 Z10 F600
  G1 Y{km.park_y - 20} F10000
  M106 S0
  M106 P2 S0
  SET_VELOCITY_LIMIT ACCEL={saved_accel}

[gcode_macro _OPTIMIZED_START_PRE_SCRAPE_WIPE]
description: Uses the stock slicer chute wipe before print-start scraping.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_start_pre_scrape_wipe_state
  G90
  M204 S5000
  {% for i in range(5) %}
    G1 Y{km.park_y - 19} F10000
    G1 Y{km.park_y} F6000
  {% endfor %}
  G1 X66 F3000
  G1 Y{km.park_y - 19}
  G1 X{km.park_x}
  G1 Y{km.park_y}
  G1 X66
  G1 Y{km.park_y - 19}
  M400
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_start_pre_scrape_wipe_state

[gcode_macro _OPTIMIZED_WIPE_NOZZLE]
description: Wipes in and out of the chute along its wiper without extrusion.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_wipe_nozzle_state
  G90
  M204 S10000
  {% for i in range(5) %}
    G1 Y{km.park_y - 19} F10000
    G1 Y{km.park_y} F6000
  {% endfor %}
  M400
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_wipe_nozzle_state

[gcode_macro _OPTIMIZED_CHUTE_DROP]
description: Sweeps across the chute so wiped waste drops, as QIDI's Smart 5 WIPE_NOZZLE_DROP does.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_chute_drop_state
  G90
  M204 S10000
  OPTIMIZED_MOVE_TO_TRASH
  G1 X66 F6000
  G1 X90 F6000
  G1 X66 F3000
  G1 X90 F6000
  G1 X66 F3000
  G1 Y{km.park_y - 19}
  G1 X90 Y{km.park_y - 20} F10000
  OPTIMIZED_MOVE_TO_TRASH
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_chute_drop_state

[gcode_macro _OPTIMIZED_CUT_FILAMENT_MOTION]
description: QIDI's Smart 5 cut at the front-right cutter; restores accel and G-code state.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_cut_filament_state
  G90
  # QIDI's _CG28 is an undefined command that Klipper ignores, so the stock cut never homed.
  G28 O X Y
  M204 S10000
  {% if (printer.gcode_move.position.x) > 169 %}
    G1 X165 F9000
    G1 Y1 F9000
  {% endif %}
  G1 Y1 F5000
  G1 X175 F5000
  G1 X178 F60
  G1 X180 F60
  M400
  M83
  G1 E-4 F1000
  M400
  G4 P2000
  G1 X160 F3000
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_cut_filament_state

[gcode_macro _OPTIMIZED_MOVE_TO_TRASH_MOTION]
description: Moves to the waste chute, straight to the chute entrance at Y179 and then in; restores accel and G-code state.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}

  SAVE_GCODE_STATE NAME=optimized_move_to_trash_state
  G90
  G28 O X Y
  M204 S10000
  # Behind the bed the toolhead fits only around the chute, so it reaches the chute entrance before going in.
  {% if (printer.gcode_move.position.y) > km.print_max[1] %}
      {% if (printer.gcode_move.position.x) > 100 or (printer.gcode_move.position.x) < 80 %}
          # Leave the chute straight forward before crossing to the entrance.
          G1 Y{km.park_y - 20} F{km.travel_speed_xy}
          G1 X{km.park_x} F{km.travel_speed_xy}
          G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
      {% endif %}
      G1 X{km.park_x} Y{km.park_y} F{km.travel_speed_xy}
  {% else %}
      M204 S{opt.trash_travel_accel}
      G1 X{km.park_x} Y{km.park_y - 20} F{opt.trash_travel_speed_xy}
      M204 S10000
      G1 Y{km.park_y} F{opt.trash_final_approach_speed_xy}
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_move_to_trash_state
