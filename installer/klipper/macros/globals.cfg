# Valve Oil-only globals that must stay out of stock-mapped files

[gcode_macro _vo_globals]
variable_package_version: "26.11.22.3"
variable_staggered_start_heating: False
variable_staggered_start_heating_dwell_seconds: 10
variable_homing_settle_short: 20
variable_homing_settle_long: 50
variable_z_home_randomize_enable: True
variable_z_home_randomize_radius: 10
variable_move_to_z_travel_speed_xy: 33900
variable_trash_travel_speed_xy: 33900
variable_trash_travel_accel: 20000
variable_trash_final_approach_speed_xy: 3500
variable_rear_scrape_orient_speed_xy: 24000
variable_unshaped_accel: 10000
gcode:

[delayed_gcode _vo_startup_banner]
initial_duration: 6
gcode:
  {% set opt = printer["gcode_macro _vo_globals"] %}
  {action_respond_info("Valve Oil v%s installed" | format(opt.package_version))}
  _VO_PRINTER_WARNINGS
