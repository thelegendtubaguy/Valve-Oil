# Makes each QIDI Box heater resend an unchanged output every second instead
# of every 3.75 s, so a busy moment in Klipper can't let it reach its 5 s MCU
# limit and disconnect the Box. Also applies the saved variable
# vo_box_heater_pwm_cycle_time, how often each Box heater switches on and off.

[vo_box_heater_refresh]
