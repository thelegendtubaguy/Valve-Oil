# X/Y homing guard for QIDI's closed-loop X/Y drivers: stops a homing touch
# whose motor is held against the frame before its driver reports the end of
# the axis, and QIDI's homing backs off and touches once more. On by default;
# turn it off with:
#   SAVE_VARIABLE VARIABLE=vo_homing_guard VALUE=0
# Printers without the closed-loop drivers ignore it. See docs/fixes.md.

[vo_homing_guard]
