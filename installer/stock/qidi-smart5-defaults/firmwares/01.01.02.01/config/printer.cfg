# S5

[mcu]
serial: /dev/ttyS1
restart_method: command
baud: 500000

[include klipper-macros-qd/*.cfg]
[include timelapse.cfg]         # 延时摄影配置

[gcode_macro _km_options]
# Any options variables declared here
gcode:

[mcu THR]
serial: /dev/ttyS4
restart_method: command
baud: 500000


[respond]
default_type: echo

[save_variables] 
filename =~/printer_data/config/saved_variables.cfg


[resonance_tester]
accel_per_hz: 150
max_smoothing:0.25
accel_chip:lis2dw
probe_points:
    90, 90, 10

[gcode_arcs]
resolution: 1.0

[filament_switch_sensor filament_switch_sensor]
pause_on_runout: True
runout_gcode:
            M118 Filament run out
            {% set enable_box = printer.save_variables.variables.enable_box|default(0) %}
            {% if enable_box == 1 %}
              {% set can_auto_reload = printer.save_variables.variables.auto_reload_detect|default(0) %}
              {% if can_auto_reload == 1 %}
                AUTO_RELOAD_FILAMENT
              {% else %}
                SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
              {% endif %}
            {% else %}
              SET_PRINT_SUB_STATUS SUB_STATUS=ext_filament_exhausted
            {% endif %}
insert_gcode:
event_delay: 3.0
pause_delay: 0.5
switch_pin:!THR:PA1



[force_move]
enable_force_move : True



[extruder]
step_pin:THR:PB9
dir_pin:!THR:PB8
enable_pin:!THR:PC15
rotation_distance: 35.5  
gear_ratio: 6.3:1
microsteps: 16
full_steps_per_rotation: 200	
nozzle_diameter: 0.400
filament_diameter: 1.75
pullup_resistor:5700
min_temp: 0
max_temp: 315
min_extrude_temp: 100
heater_pin:THR:PB15
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:THR:PA4
max_power: 1
open_5s_limit: True
open_5s_limit_power: 0.5

control : pid
pid_Kp=27.858
pid_Ki=5.159
pid_Kd=37.609

pressure_advance: 0.032
pressure_advance_smooth_time: 0.03
max_extrude_cross_section:500
instantaneous_corner_velocity: 10.000
max_extrude_only_distance: 1000.0
max_extrude_only_velocity:5000


[tmc2209 extruder]
uart_pin:THR:PC13
interpolate: True
run_current: 0.857
stealthchop_threshold: 0

[lis2dw]
cs_pin:THR:PA10
spi_software_sclk_pin:THR:PA5
spi_software_mosi_pin:THR:PA7
spi_software_miso_pin:THR:PA6
axes_map: y, z, -x

[printer]
kinematics:corexy
max_velocity: 400
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8


[cuc y]
mcu: mcu
theshold:38
mt:0
ec:13.0 # 200 * 1000000
homing_delay_us = 200000
current = 1.6
microestep:32

[cuc x]
mcu: mcu
theshold:38
mt:1
ec:13.0
homing_delay_us = 200000
current = 1.6
microestep:32

[cuc z]
mcu: mcu
theshold:38
mt:2
ec:13
homing_delay_us = 200000
current = 0.8
microestep:32
[stepper_y]
step_pin: GPIO4.25
dir_pin:  !GPIO4.26
enable_pin:GPIO4.16
microsteps: 32
rotation_distance: 39
full_steps_per_rotation:200  
endstop_pin:cuc_y:virtual_endstop
position_min: -4
position_endstop: -4
position_max: 200
homing_speed:50 
homing_retract_dist: 50.0
homing_retract_speed: 200
second_homing_speed: 50.0
homing_positive_dir:false
homing_tolerance: 2
homing_retries: 10
before_homing_gcode:
    _BEFORE_HOME_Y
after_homing_gcode:
    _AFTER_HOME_Y

[stepper_x]
step_pin: GPIO2.23
dir_pin:  !GPIO4.1
enable_pin:GPIO4.16
microsteps:32
rotation_distance: 39
full_steps_per_rotation:200  
endstop_pin:cuc_x:virtual_endstop
position_min: -2
position_endstop: -2
position_max:185
homing_speed:50
homing_retract_dist: 50.0
homing_retract_speed: 200
second_homing_speed: 50.0
homing_positive_dir:false
homing_tolerance: 2
homing_retries: 10
before_homing_gcode:
    _BEFORE_HOME_X
after_homing_gcode:
    _AFTER_HOME_X

[stepper_z]
step_pin: GPIO4.3
dir_pin:  !GPIO4.5
enable_pin:GPIO4.16
microsteps:32
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin:probe:z_virtual_endstop 
position_max:182
position_min: -4
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 10.0
homing_positive_dir:false


[heater_bed]
heater_pin: GPIO2.26
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: GPIO2.9
max_power: 0.8
control = pid
pid_Kp=69.232 
pid_Ki=0.3
pid_Kd=80.724
pwm_cycle_time:0.1
min_temp: -60
max_temp: 85

[verify_heater extruder]
max_error: 120
check_gain_time:20
hysteresis: 2
heating_gain: 2

[verify_heater heater_bed]
max_error: 400
check_gain_time:120
hysteresis: 2
heating_gain: 1


[heater_fan hotend_fan]
pin:THR:PA11
max_power: 1.0
shutdown_speed:1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0
tachometer_pin:THR:PA12
tachometer_ppr: 2
tachometer_poll_interval: 0.0005


[fan_generic cooling_fan]
pin:THR:PA8
max_power: 1.0
shutdown_speed:0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
tachometer_pin:THR:PA9
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[controller_fan board_fan]
pin:GPIO1.1
max_power:1.0
shutdown_speed:1.0
cycle_time:0.01
fan_speed: 1.0
stepper:stepper_z


[fan_generic chamber_circulation_fan]
pin: GPIO1.3
shutdown_speed: 0.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0


[output_pin caselight]
pin:GPIO2.19
pwm: false
shutdown_value:0
value:1

[smart_output_pin caselight]  

[output_pin beeper]
pin:GPIO4.22
pwm: false
shutdown_value:0
value:0



[neopixel RGB]
pin:GPIO2.16
#   连接到neopixel的引脚。
#   必须提供此参数。
chain_count:11
#   菊链中 neopixel 芯片的数量。
#   默认为1（代表有一个neopixel芯片连接到了这个引脚）。
color_order: GRB
#   设置LED硬件的RGB像素顺序（提供一个包含字母R（红），G（绿）
#   ，B（蓝）和W（白）的字符串，W是可选的）。或者也可以用一个
#   逗号分隔字符列表来描述像素顺序。
#   默认为GRB。
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0



[probe_air]
sensor_type: c_sensor
sclk_pin: THR:PB3
dout_pin:THR: PB4
voltage: 4.95
delta_v: 0.04
z_offset:-0.11
speed: 5
lift_speed:5
samples: 2
sample_retract_dist:3
samples_result: average
samples_tolerance: 0.02
samples_tolerance_retries: 10


[bed_mesh]
speed:150
horizontal_move_z:5
mesh_min:10,10
mesh_max:165,170  
probe_count:5,5  
algorithm:lagrange#bicubic


[idle_timeout]
timeout: 43200
gcode:
    M118 Pause Timeout: Turn off heaters
    #PRINT_END
    M106 S0
    M104 S0
    M140 S0
    M141 S0
#    DISABLE_BOX_HEATER
    _KM_IDLE_TIMEOUT

[pause_resume]

[display_status]

[exclude_object]

[print_stats_manager]

[d_bus_service_manager]

[ai_func_manager]


[include box.cfg]
# [database]
[multi_color_controller]

[box485]
serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0	# 串口设备节点的地址，默认不用改，不用/dev/ttyUSB0，因为热插拔会变化
baud: 115200			# 串口波特率，默认不用改
address_start: 1		# 盒子起始地址，从1开始，因为0用作广播
address_end: 127		# 盒子结束地址，start~end作为动态分配范围，预留后面的给刀架和缓冲器等设备
serial_timeout: 0.0		# 秒， 串口超时设置
hall_value: 2000		# 霍尔传感器的触发阈值
extrude_timeout: 0.0		# 暂时这样配置
extrude_length:30		# 暂时这样配置

[box2base]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

