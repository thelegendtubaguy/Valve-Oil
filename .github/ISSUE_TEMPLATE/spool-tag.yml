name: Spool tag doesn't read
description: A spool's RFID tag doesn't set the QIDI Box slot, or sets the wrong filament or color.
title: "[Spool tag]: "
labels: ["qidi-box", "spool-tag"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping add spools. Reading Anycubic, Elegoo, and Bambu Lab tags needs the [Valve Oil Box firmware](https://github.com/thelegendtubaguy/valve-oil/blob/main/docs/firmware.md#qidi-box-firmware) on a USB Box.
        The report file is what lets us support a new brand. [Spools that don't read](https://github.com/thelegendtubaguy/valve-oil/blob/main/docs/qidi-box.md#spools-that-dont-read) explains how to make one with `TLTG_BOX_RFID_REPORT`. Reports never include the tag's serial number.

  - type: input
    id: brand
    attributes:
      label: Spool brand and filament
      description: As printed on the spool's label, for example "Sunlu PLA Meta, white".
    validations:
      required: true

  - type: input
    id: color
    attributes:
      label: Filament color
      description: The color name on the label, and a hex code if the label or the maker's site gives one.

  - type: dropdown
    id: result
    attributes:
      label: What happened?
      options:
        - The slot didn't change
        - The slot got the wrong filament or color
        - The touchscreen or console said "Unrecognized label"
        - Other (say below)
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Tag report
      description: Attach the `tltg_rfid_*.json` file from Fluidd's **Logs** (drag it in), or paste its contents.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Where the tag sits on the spool, whether a phone app can read it, or what other printers it works with.
