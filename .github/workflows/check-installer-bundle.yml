name: check-installer-bundle

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-installer-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run installer core tests
        run: python3 scripts/run_installer_core_tests.py
      - name: Validate installer compatibility metadata
        run: python3 scripts/check_installer_known_versions.py
      - uses: actions/setup-node@v6
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: installer-downloads-${{ hashFiles('installer/package.yaml') }}
          restore-keys: installer-downloads-
      - name: Build and smoke-test installer bundle and USB drive image
        # QIDI's target packages are stood in for; their pins are checked when a release builds the image.
        run: python3 scripts/build_installer_bundle.py --output-dir dist --channel release --smoke-test --usb-image --usb-stub-qidi
