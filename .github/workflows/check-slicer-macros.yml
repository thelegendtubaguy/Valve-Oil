name: Check Slicer Macros

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-slicer-macros:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate slicer macro references
        run: python3 scripts/check_slicer_macros.py
