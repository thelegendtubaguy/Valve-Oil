<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valve Oil USB installer: touchscreen mockups</title>
<style>
  @font-face { font-family: "Montserrat"; src: url("../fonts/Montserrat-VF.ttf") format("truetype"); font-weight: 100 900; }
  :root {
    --bg: #0D1117; --surface: #161C25; --surface-2: #1D2530; --line: #2B3440;
    --ink: #F0F0F0; --ink-2: #A3ADBA; --ink-3: #6F7A88;
    --amber: #F2B05A; --amber-2: #E39A3E; --crimson: #C84A5A; --crimson-2: #A93C4B; --green: #62C28E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05070A; color: var(--ink);
    font-family: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .gallery { padding: 32px 40px 60px; max-width: 1760px; margin: 0 auto; }
  .gallery h1 { font-size: 26px; margin: 0 0 6px; }
  .gallery p.lead { color: var(--ink-2); margin: 0 0 8px; max-width: 900px; line-height: 1.45; }
  .gallery h2 { font-size: 18px; margin: 38px 0 14px; color: var(--amber); letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(2, 800px); gap: 34px 40px; }
  figure { margin: 0; }
  figcaption { color: var(--ink-2); font-size: 14px; margin-top: 10px; line-height: 1.4; max-width: 800px; }
  figcaption b { color: var(--ink); }
  body.single { background: var(--bg); overflow: hidden; }
  body.single .gallery { padding: 0; max-width: none; }

  /* ---- one 800x480 touchscreen ---- */
  .screen { width: 800px; height: 480px; background: var(--bg); position: relative; overflow: hidden;
    border-radius: 6px; outline: 1px solid #222a35; }
  body.single .screen { border-radius: 0; outline: none; }
  .hdr { position: absolute; left: 28px; right: 24px; top: 14px; height: 44px; display: flex; align-items: center; gap: 12px; }
  .hdr .mark { height: 40px; width: 21px; flex: none; }
  .hdr .brand { font-weight: 800; letter-spacing: .16em; font-size: 14px; }
  .hdr .sep { color: var(--ink-3); }
  .hdr .where { color: var(--ink-2); font-size: 15px; }
  .hdr .grow { flex: 1; }
  .hdr .step { color: var(--ink-2); font-size: 15px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .chip { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .title { position: absolute; left: 28px; right: 28px; top: 70px; font-size: 30px; font-weight: 700; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 12px; }
  .title .ico { width: 30px; height: 30px; flex: none; }
  .body { position: absolute; left: 28px; right: 28px; top: 118px; font-size: 18px; line-height: 1.38; color: var(--ink); }
  .body p { margin: 0 0 10px; }
  .muted { color: var(--ink-2); }
  .warn { color: var(--amber); }
  .bad { color: #F08A97; }
  .good { color: var(--green); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 18px; margin-top: 8px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; font-size: 18px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .k { color: var(--ink-2); width: 190px; flex: none; }
  .row .v { flex: 1; }
  .row .v small { color: var(--ink-2); font-size: 15px; margin-left: 8px; }
  .actions { position: absolute; left: 28px; right: 28px; bottom: 40px; display: flex; gap: 14px; }
  .btn { height: 64px; border-radius: 12px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-size: 19px; font-weight: 650; background: var(--surface-2); border: 1px solid #3A4553; color: var(--ink); padding: 0 12px; line-height: 1.15; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #14100A; }
  .btn.danger { background: transparent; border-color: var(--crimson); color: #F08A97; }
  .btn.small { flex: 0 0 150px; }
  .btn.wide { flex: 1.6; }
  .btn small { display: block; font-size: 13px; font-weight: 500; opacity: .75; margin-top: 2px; }
  .ftr { position: absolute; left: 0; right: 0; bottom: 11px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .bar { height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--amber-2), var(--amber)); }
  .steps { display: grid; grid-auto-flow: column; grid-template-rows: repeat(5, auto); grid-template-columns: 1fr 1fr; gap: 3px 28px; margin-top: 16px; font-size: 17px; }
  .steps div { display: flex; gap: 10px; align-items: center; color: var(--ink-3); }
  .steps div.done { color: var(--ink-2); }
  .steps div.now { color: var(--ink); font-weight: 650; }
  .steps .d { width: 18px; text-align: center; flex: none; }
  .steps .done .d { color: var(--green); }
  .steps .now .d { color: var(--amber); }
  .biglogo { position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; }
  .biglogo svg { height: 208px; }
  .center { position: absolute; left: 28px; right: 28px; text-align: center; }
  .spin { position: absolute; left: 372px; width: 56px; height: 56px; border-radius: 50%; border: 6px solid var(--surface2, #1D2530); border-top-color: #F2B05A; }
  .wait { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 16px; border-radius: 12px; border: 1px solid #F2B05A; background: rgba(242,176,90,.12); color: #F2B05A; font-size: 18px; font-weight: 600; }
  .wait .spin { position: static; width: 24px; height: 24px; border-width: 4px; flex: none; }
  .log { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.5; color: var(--ink-2);
    background: #080B10; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; height: 250px; overflow: hidden; white-space: pre; }
  .log b { color: var(--ink); font-weight: 500; } .log em { color: #F08A97; font-style: normal; }
  .qr { width: 104px; height: 104px; border-radius: 8px; background: #F0F0F0; flex: none; display: grid; place-items: center; color: #0D1117; font-size: 12px; font-weight: 700;
    background-image: linear-gradient(45deg, #0D1117 25%, transparent 25%, transparent 75%, #0D1117 75%), linear-gradient(45deg, #0D1117 25%, transparent 25%, transparent 75%, #0D1117 75%);
    background-size: 13px 13px; background-position: 0 0, 6.5px 6.5px; background-color: #F0F0F0; }
  .qr span { background: #F0F0F0; padding: 2px 6px; border-radius: 4px; }
  .split { display: flex; gap: 22px; align-items: flex-start; }
  .split > .txt { flex: 1; }
  ol.next { margin: 6px 0 0; padding-left: 26px; } ol.next li { margin-bottom: 5px; }
  .toggle { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 10px; }
  .sw { width: 54px; height: 30px; border-radius: 15px; background: var(--amber); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 12px; background: #14100A; }
</style>
</head>
<body>
<div class="gallery" id="root"></div>
<script>
const VERSION = "26.11.12.1";
const LOGO = `<rect x="50" y="150" width="200" height="190" fill="#F0F0F0"/><ellipse cx="150" cy="340" rx="100" ry="32" fill="#F0F0F0"/><path d="M50,190 Q150,220 250,190" stroke="#F2B05A" stroke-width="7" fill="none" opacity="0.95"/><path d="M50,300 Q150,330 250,300" stroke="#F2B05A" stroke-width="7" fill="none" opacity="0.95"/><ellipse cx="150" cy="150" rx="100" ry="32" fill="#F2B05A" stroke="#0D1117" stroke-width="6"/><ellipse cx="150" cy="150" rx="34" ry="11" fill="#E39A3E"/><rect x="136" y="70" width="28" height="82" fill="#F0F0F0" stroke="#0D1117" stroke-width="5"/><rect x="88" y="34" width="124" height="38" fill="#A93C4B"/><ellipse cx="150" cy="72" rx="62" ry="19" fill="#A93C4B"/><ellipse cx="150" cy="34" rx="62" ry="19" fill="#C84A5A" stroke="#0D1117" stroke-width="5"/><path d="M150,392 C164,412 180,428 180,444 A30,28 0 0 1 120,444 C120,428 136,412 150,392 Z" fill="#F2B05A" stroke="#0D1117" stroke-width="5"/><g transform="translate(370,15)"><polygon points="0,0 68,0 105.0,128 142,0 210,0 145.0,200 65.0,200" fill="#F0F0F0" /><polygon points="297.0,0 385.0,0 448,200 234,200" fill="#F0F0F0" /><polygon points="341.0,72 381.0,170 301.0,170" fill="#C84A5A" /><polygon points="472,0 538,0 538,140 642,140 642,200 472,200" fill="#F0F0F0" /><polygon points="666,0 734,0 771.0,128 808,0 876,0 811.0,200 731.0,200" fill="#F0F0F0" /><polygon points="900,0 1070,0 1070,50 966,50 966,77 1056,77 1056,123 966,123 966,150 1070,150 1070,200 900,200" fill="#F0F0F0" /></g><g transform="translate(370,255)"><path d="M88.0,0 C128.0,50 176,98 176,132 A88.0,74.0 0 0 1 0,132 C0,98 48.0,50 88.0,0 Z" fill="#F0F0F0"/><path d="M88.0,78 C104.0,100 126,118 126,136 A38.0,34.0 0 0 1 50,136 C50,118 72.0,100 88.0,78 Z" fill="#F2B05A"/><rect x="200" y="0" width="66" height="200" fill="#F0F0F0"/><polygon points="290,0 356,0 356,140 460,140 460,200 290,200" fill="#F0F0F0" /></g>`;
const fullLogo = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 1440 490">${LOGO}</svg>`;
const mark = `<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="40 8 220 470">${LOGO}</svg>`;
const ICO = {
  check: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#62C28E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`,
  stop: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#F08A97" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6M12 16.6v.4"/></svg>`,
  pause: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#F2B05A" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6M12 16.6v.4"/></svg>`,
  down: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#F2B05A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10.5l5 5 5-5M4 20.5h16"/></svg>`,
  up: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#F2B05A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 8.5l5-5 5 5M4 20.5h16"/></svg>`,
  q: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#F2B05A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4.3 2.6c-.9.5-1.5 1-1.5 2M12 17v.3"/></svg>`,
  list: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0F0F0" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
};
const hdr = (o = {}) => `<div class="hdr">${mark}<span class="brand">VALVE OIL</span><span class="sep">|</span><span class="where">${o.where ?? "QIDI Max 4"}</span><span class="grow"></span>${o.step ? `<span class="step">${o.step}</span>` : ""}${o.quit ? `<div class="chip">Quit</div>` : ""}<div class="chip">${ICO.list} Log</div></div>`;
const ftr = (t) => `<div class="ftr">${t ?? `Valve Oil ${VERSION} · USB installer · QIDI firmware 01.01.07.01`}</div>`;
const rows = (r) => `<div class="card">${r.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>`;
const actions = (b) => `<div class="actions">${b.map(([t, c]) => `<div class="btn ${c ?? ""}">${t}</div>`).join("")}</div>`;
const steps = (list, now) => `<div class="steps">${list.map((s, i) => `<div class="${i < now ? "done" : i === now ? "now" : ""}"><span class="d">${i < now ? "✓" : i === now ? "›" : "•"}</span>${s}</div>`).join("")}</div>`;
const STEPS = ["Check the printer", "Back up your configuration", "Macros and Klipper fixes", "System changes", "Fluidd and Valve Oil UI", "Toolhead and mainboard firmware", "QIDI Box 1 firmware", "QIDI Box 2 firmware", "Restart Klipper and verify", "Finish"];

const USTEPS = ["Check the printer", "Back up your configuration", "Macros and Klipper fixes", "System changes", "Fluidd and Valve Oil UI", "Board firmware", "Restart Klipper and verify", "Finish"];
const groups = [
  ["First install", [
    { id: "01-checking", cap: "<b>Checking.</b> Opens as soon as the printer hands over the screen. Nothing is written until the Install button on the Ready screen.",
      html: `${hdr()}<div class="spin" style="top:178px"></div><div class="center" style="top:252px;font-size:22px">Checking the printer…</div><div class="center muted" style="top:288px;font-size:16px">Nothing has been changed yet.</div>${ftr()}` },
    { id: "02-welcome", cap: "<b>What it found.</b> The printer, its firmware, and its Boxes, so people see it recognized their machine before they commit.",
      html: `${hdr({ quit: 1 })}<div class="title">${ICO.down}Install Valve Oil ${VERSION}</div><div class="body">${rows([["Printer", "QIDI Max 4"], ["QIDI firmware", `01.01.07.01 <small class="good">supported</small>`], ["QIDI Box", "2 connected"], ["Valve Oil", "Not installed"]])}<p class="muted" style="margin-top:14px">A few questions first, then the install runs by itself: about 6 minutes, plus 4 minutes for each QIDI Box.</p></div>${actions([["Quit", "small"], ["Get started", "primary"]])}${ftr()}` },
    { id: "02b-firmware-first", cap: "<b>Older QIDI firmware.</b> The same screen when the printer needs QIDI's firmware update first. It says so and how long it adds. QIDI's package is on the drive, so no network is needed.",
      html: `${hdr({ quit: 1 })}<div class="title">${ICO.down}Install Valve Oil ${VERSION}</div><div class="body">${rows([["Printer", "QIDI Max 4"], ["QIDI firmware", `01.01.06.05 <small class="warn">updated to 01.01.07.01 first</small>`], ["QIDI Box", "2 connected"], ["Valve Oil", "Not installed"]])}<p class="muted" style="margin-top:14px">This Valve Oil runs on QIDI firmware 01.01.07.01, so the installer updates the printer to it first, from this drive. That adds about 15 minutes.</p></div>${actions([["Quit", "small"], ["Get started", "primary"]])}${ftr(`Valve Oil ${VERSION} · USB installer · QIDI firmware 01.01.06.05`)}` },
    { id: "03-auto-updates", cap: "<b>Question: automatic updates.</b> Every question gets its own screen, one decision at a time.",
      html: `${hdr({ step: "Question 1 of 2" })}<div class="title">${ICO.q}Keep Valve Oil updated?</div><div class="body"><p>The printer checks for a new release every hour and installs it by itself.</p><p class="muted">It never updates during a print, while a print is paused, or while a heater is on. You can turn this off later.</p></div>${actions([["Back", "small"], ["No, I'll update by hand"], ["Yes, update automatically", "primary"]])}${ftr()}` },
    { id: "04-ai-detection", cap: "<b>Question: QIDI AI detection.</b> Only shown while AI detection is on.",
      html: `${hdr({ step: "Question 2 of 2" })}<div class="title">${ICO.q}Turn off QIDI AI detection?</div><div class="body"><p>QIDI's spaghetti and foreign object detection can use about 190 MB of the printer's 486 MB of memory during a print.</p><p class="muted">If you turn it off, also switch off Spaghetti Detection and Foreign Object Detection in the touchscreen's Settings → Printing Options afterwards, so the screen matches.</p></div>${actions([["Back", "small"], ["Keep it on"], ["Turn it off", "primary"]])}${ftr()}` },
    { id: "07-ready", cap: "<b>Ready to install.</b> Every answer on one screen, with the time it will take. This is the last tap until it finishes.",
      html: `${hdr()}<div class="title">${ICO.down}Ready to install</div><div class="body" style="top:112px">${rows([["Valve Oil", `${VERSION} <small>on QIDI Max 4</small>`], ["Automatic updates", "On"], ["QIDI AI detection", "Turned off"], ["QIDI Box", `2 found <small>Box support turned on</small>`], ["Board firmware", `Toolhead, mainboard, Box 1, Box 2`]])}<p class="muted" style="margin-top:9px;font-size:16px">Backed up first. About 14 minutes. Keep the printer and Boxes on.</p></div>${actions([["Back", "small"], ["Install", "primary"]])}${ftr()}` },
    { id: "08-installing", cap: "<b>Installing.</b> Real steps in plain words, elapsed time, and a bar that moves through the slow parts. No taps needed. SSH installs and automatic updates show this screen too (below).",
      html: `${hdr({ step: "Step 4 of 10 · 1:52" })}<div class="title">${ICO.down}Installing</div><div class="body"><p style="margin-bottom:12px">System changes <span class="muted">· restarting Moonraker…</span></p><div class="bar"><i style="width:38%"></i></div>${steps(STEPS, 3)}</div><div class="center warn" style="bottom:40px;font-size:16px">Don't turn the printer off. It restarts by itself at the end.</div>${ftr()}` },
    { id: "09-box-firmware", cap: "<b>Installing, Box firmware.</b> The long quiet part gets its own named step and time, so it doesn't look stuck.",
      html: `${hdr({ step: "Step 8 of 10 · 9:31" })}<div class="title">${ICO.down}Installing</div><div class="body"><p style="margin-bottom:12px">QIDI Box 2 firmware <span class="muted">· flashing, about 4 minutes</span></p><div class="bar"><i style="width:74%"></i></div>${steps(STEPS, 7)}</div><div class="center warn" style="bottom:40px;font-size:16px">Keep the printer and Box 2 powered on.</div>${ftr()}` },
    { id: "10-done", cap: "<b>Done.</b> The log is already on the drive. The screen waits for the drive to come out and restarts the printer as soon as it does. Restart now is for anyone who'd rather leave the drive in.",
      html: `${hdr({ step: "Finished in 13:48" })}<div class="title">${ICO.check}Valve Oil is installed</div><div class="body"><div class="split"><div class="txt"><ol class="next"><li>Take out the USB drive. The log is already saved on it.</li><li>The printer restarts by itself. Wait for the home screen.</li><li>Open Fluidd at <b>http://192.168.1.50</b></li><li>Set up your slicer: scan the code, or see<br><b>github.com/thelegendtubaguy/valve-oil</b></li></ol></div><div class="qr"><span>SLICER</span></div></div><div class="wait"><span class="spin"></span>Waiting for the USB drive to be taken out…</div></div>${actions([["Restart now <small>leave the drive in</small>", "small"]])}${ftr()}` },
  ]],
  ["Running it again", [
    { id: "11-update", cap: "<b>Update available.</b> What a printer with an older Valve Oil opens on. One tap updates with the settings it already has.",
      html: `${hdr({ quit: 1 })}<div class="title">${ICO.up}Update available</div><div class="body">${rows([["Installed", "26.11.11.3"], ["On this drive", `${VERSION} <small class="good">newer</small>`], ["Settings kept", "Automatic updates on · AI detection off · Box support on"]])}<p class="muted" style="margin-top:14px">Your settings and configuration are kept. Your configuration is backed up first.</p></div>${actions([["Change settings"], ["Update", "primary wide"]])}${ftr()}` },
    { id: "12-up-to-date", cap: "<b>Up to date.</b> The same drive doubles as the tool for changing settings and restoring a backup. Uninstalling isn't on the drive.",
      html: `${hdr({ quit: 1 })}<div class="title">${ICO.check}Valve Oil is up to date</div><div class="body">${rows([["Installed", `${VERSION} <small>3 days ago</small>`], ["Settings", "Automatic updates on · AI detection off · Box support on"], ["Last backup", "12 Nov 2026, 09:14"]])}</div>${actions([["Restore a backup"], ["Change settings"], ["Install again"]])}${ftr()}` },
  ]],
  ["SSH installs and automatic updates", [
    { id: "18-ssh-install", cap: "<b>Installing over SSH.</b> The same progress screen in place of today's still image, while the install runs from a computer. The footer says where it was started.",
      html: `${hdr({ step: "Step 4 of 10 · 1:52" })}<div class="title">${ICO.down}Installing</div><div class="body"><p style="margin-bottom:12px">System changes <span class="muted">· restarting Moonraker…</span></p><div class="bar"><i style="width:38%"></i></div>${steps(STEPS, 3)}</div><div class="center warn" style="bottom:40px;font-size:16px">Don't turn the printer off. It restarts by itself at the end.</div>${ftr(`Valve Oil ${VERSION} · installing over SSH · QIDI firmware 01.01.07.01`)}` },
    { id: "19-auto-update", cap: "<b>Automatic update.</b> What someone walking up to the printer sees while it updates itself: what, from which version, and how far along.",
      html: `${hdr({ step: "Step 3 of 8 · 0:48" })}<div class="title">${ICO.up}Updating Valve Oil</div><div class="body"><p style="margin-bottom:12px">Macros and Klipper fixes <span class="muted">· 26.11.11.3 to ${VERSION}</span></p><div class="bar"><i style="width:30%"></i></div>${steps(USTEPS, 2)}</div><div class="center warn" style="bottom:40px;font-size:16px">Automatic updates are on. Don't turn the printer off.</div>${ftr(`Valve Oil 26.11.11.3 → ${VERSION} · automatic update`)}` },
  ]],
  ["When it can't go ahead", [
    { id: "14-busy", cap: "<b>Printer busy.</b> Says the reason and how to clear it, and rechecks without starting over.",
      html: `${hdr({ quit: 1 })}<div class="title">${ICO.pause}Can't install right now</div><div class="body"><p>A heater is on. Installing restarts Klipper, and that isn't safe while something is heating.</p>${rows([["Bed", `60 °C target <small class="warn">turn off</small>`], ["Nozzle", "Off"], ["Chamber", "Off"], ["Box dryers", "Off"]])}<p class="muted" style="margin-top:10px;font-size:16px">Nothing has been changed.</p></div>${actions([["Quit", "small"], ["Check again", "primary"]])}${ftr()}` },
    { id: "15-unsupported", cap: "<b>Unsupported firmware.</b> Says what it found, what it supports, and that the printer is untouched.",
      html: `${hdr({ where: "QIDI Max 4" })}<div class="title">${ICO.stop}This QIDI firmware isn't supported yet</div><div class="body">${rows([["This printer", "QIDI firmware 01.01.08.00"], [`Valve Oil ${VERSION}`, "Supports 01.01.06.03 to 01.01.07.01"]])}<p style="margin-top:14px">Nothing has been changed. A newer Valve Oil may support it: download the latest USB installer from <b>github.com/thelegendtubaguy/valve-oil</b> and try again.</p></div>${actions([["Back to QIDI's screen", "primary"]])}${ftr(`Valve Oil ${VERSION} · USB installer · QIDI firmware 01.01.08.00`)}` },
    { id: "15b-board-not-supported", cap: "<b>Board not supported.</b> A new install stops before any change when a board isn't one the release knows. The code opens the printer-support form already filled in.",

    { id: "16-failed", cap: "<b>Install stopped.</b> Names the step, says the printer was put back, and where the log is.",
      html: `${hdr({ step: "Stopped after 2:07" })}<div class="title">${ICO.stop}Install stopped</div><div class="body"><p>Step 4, System changes, did not finish:</p><p class="bad" style="font-size:17px">Moonraker did not come back after it was restarted.</p><p><span class="good">Everything was put back the way it was.</span> Your configuration backup is kept.</p><p class="muted" style="font-size:16px">The log is saved on the USB drive as <b style="color:var(--ink)">valve-oil-install.log</b>. Attach it if you report this.</p></div>${actions([["Quit", "small"], ["View log"], ["Try again", "primary"]])}${ftr()}` },
    { id: "17-log", cap: "<b>Log.</b> One tap from any screen. The same text is saved to the USB drive.",
      html: `${hdr({ step: "Step 4 of 10 · 1:52" })}<div class="title" style="font-size:24px;top:66px">${ICO.down}Installer log</div><div class="body" style="top:106px"><div class="log"><b>09:14:02</b>  Printer: QIDI Max 4, QIDI firmware 01.01.07.01
<b>09:14:02</b>  Valve Oil: not installed. Installing ${VERSION}

<b>09:14:11</b>  Backup: backup-tltg-optimized-01.01.07.01-${VERSION}.zip

<b>09:14:52</b>    Restarting Moonraker...</div></div>${actions([["Close", "primary"]])}${ftr()}` },
  ]],
];

const root = document.getElementById("root");
const want = new URLSearchParams(location.search).get("s");
if (want) {
  document.body.classList.add("single");
  const s = groups.flatMap((g) => g[1]).find((x) => x.id === want);
  root.innerHTML = `<div class="screen">${s.html}</div>`;
} else {
  root.innerHTML = `<h1>Valve Oil USB installer: touchscreen mockups</h1><p class="lead">Each frame is 800×480, the size of the Max 4 and Plus 5 touchscreens. The version number, IP address, times, and QR code are placeholders.</p>` +
    groups.map(([name, list]) => `<h2>${name}</h2><div class="grid">${list.map((s) => `<figure><div class="screen">${s.html}</div><figcaption>${s.cap}</figcaption></figure>`).join("")}</div>`).join("");
}
window.SCREEN_IDS = groups.flatMap((g) => g[1]).map((x) => x.id);
</script>
