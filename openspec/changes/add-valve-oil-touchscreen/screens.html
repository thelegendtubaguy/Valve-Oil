<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valve Oil touchscreen: concept mockups</title>
<style>
  @font-face { font-family: "Montserrat"; src: url("../fonts/Montserrat-VF.ttf") format("truetype"); font-weight: 100 900; }
  :root {
    --bg: #0D1117; --rail: #090C11; --surface: #161C25; --surface-2: #1D2530; --line: #2B3440; --line-2: #3A4553;
    --ink: #F0F0F0; --ink-2: #A3ADBA; --ink-3: #6F7A88;
    --amber: #F2B05A; --amber-2: #E39A3E; --amber-tint: rgba(242,176,90,.14);
    --crimson: #C84A5A; --rose: #F08A97; --green: #62C28E; --blue: #6FB3F2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05070A; color: var(--ink);
    font-family: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .gallery { padding: 32px 40px 60px; max-width: 1760px; margin: 0 auto; }
  .gallery h1 { font-size: 26px; margin: 0 0 6px; }
  .gallery p.lead { color: var(--ink-2); margin: 0 0 8px; max-width: 980px; line-height: 1.45; }
  .gallery h2 { font-size: 18px; margin: 38px 0 14px; color: var(--amber); letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(2, 800px); gap: 34px 40px; }
  figure { margin: 0; }
  figcaption { color: var(--ink-2); font-size: 14px; margin-top: 10px; line-height: 1.4; max-width: 800px; }
  figcaption b { color: var(--ink); }
  body.single { background: var(--bg); overflow: hidden; }
  body.single .gallery { padding: 0; max-width: none; }

  .screen { width: 800px; height: 480px; background: var(--bg); position: relative; overflow: hidden; border-radius: 6px;
    outline: 1px solid #222a35; display: flex; font-variant-numeric: tabular-nums; }
  body.single .screen { border-radius: 0; outline: none; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* rail */
  .rail { width: 80px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
  .rail .mark { width: 24px; height: 46px; margin-bottom: 6px; }
  .nav { width: 66px; height: 66px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--ink-3); font-size: 11.5px; font-weight: 600; margin-top: 4px; }
  .nav svg.i { width: 26px; height: 26px; }
  .nav.on { color: var(--amber); background: var(--amber-tint); }

  /* main */
  .main { flex: 1; padding: 12px 20px 16px 20px; position: relative; min-width: 0; }
  .top { height: 40px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top h3 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dot.amber { background: var(--amber); } .dot.red { background: var(--crimson); }
  .grow { flex: 1; }
  .mini { display: flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }
  .mini svg.i { width: 17px; height: 17px; color: var(--ink-3); }
  .mini.hot { color: var(--amber); } .mini.hot svg.i { color: var(--amber); }
  .clock { color: var(--ink-2); font-size: 15px; font-weight: 600; margin-left: 6px; }
  .muted { color: var(--ink-2); } .dim { color: var(--ink-3); } .amber { color: var(--amber); } .green { color: var(--green); } .rose { color: var(--rose); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .rowf { display: flex; gap: 12px; }
  .btn { height: 58px; border-radius: 13px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; text-align: center;
    font-size: 17.5px; font-weight: 650; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink); padding: 0 12px; line-height: 1.15; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #14100A; }
  .btn.danger { background: transparent; border-color: var(--crimson); color: var(--rose); }
  .btn.small { flex: 0 0 132px; } .btn.tall { height: 64px; }
  .bottom { position: absolute; left: 20px; right: 20px; bottom: 16px; }
  .chip { height: 42px; padding: 0 16px; border-radius: 21px; background: var(--surface-2); border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 8px;
    font-size: 15.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .chip.on { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); }
  .chips { display: flex; gap: 8px; flex-wrap: nowrap; }
  .sw { width: 22px; height: 22px; border-radius: 11px; flex: none; border: 2px solid rgba(255,255,255,.22); }
  .bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--amber-2), var(--amber)); }

  /* temps */
  .temp { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .temp .lab { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }
  .temp .lab svg.i { width: 19px; height: 19px; }
  .temp .val { font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

  .temp .tgt { font-size: 14.5px; color: var(--ink-3); font-weight: 600; }
  .temp.hot { border-color: rgba(242,176,90,.55); } .temp.hot .tgt { color: var(--amber); }

  .thumb { border-radius: 12px; background: radial-gradient(120% 90% at 50% 20%, #232C39, #121820); flex: none; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
  .file { display: flex; align-items: center; gap: 14px; padding: 9px 12px; }

  .file .nm { font-size: 17.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .meta { color: var(--ink-2); font-size: 14.5px; margin-top: 3px; display: flex; align-items: center; gap: 7px; }
  .kv { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 16.5px; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv .k { color: var(--ink-2); width: 108px; flex: none; }
  .steps { display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, auto); grid-template-columns: 1fr 1fr; gap: 7px 22px; font-size: 16.5px; }
  .steps div { display: flex; gap: 10px; align-items: center; color: var(--ink-3); white-space: nowrap; }
  .steps div.done { color: var(--ink-2); } .steps div.now { color: var(--ink); font-weight: 650; }
  .steps .d { width: 18px; text-align: center; flex: none; }
  .steps .done .d { color: var(--green); } .steps .now .d { color: var(--amber); }
  .pm { width: 54px; height: 54px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 26px; font-weight: 500; flex: none; }
  .tile { padding: 12px 14px; flex: 1; }
  .tile .lab { color: var(--ink-2); font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .tile .lab svg.i { width: 18px; height: 18px; }
  .tile .big { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .slot { flex: 1; padding: 12px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
  .slot.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
  .slot .n { position: absolute; left: 11px; top: 9px; font-size: 14px; font-weight: 700; color: var(--ink-3); }
  .slot .tg { position: absolute; right: 10px; top: 8px; color: var(--ink-3); } .slot .tg svg.i { width: 17px; height: 17px; }
  .slot .mat { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .slot .br { font-size: 13.5px; color: var(--ink-2); }
  .slot .st { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .slot.on .st { color: var(--amber); }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg span { height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; font-size: 15px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
  .seg span.on { background: var(--surface-2); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
  .jog { width: 236px; height: 236px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); position: relative; flex: none; }
  .jog .a { position: absolute; width: 60px; height: 60px; display: grid; place-items: center; color: var(--ink); }
  .jog .a svg.i { width: 30px; height: 30px; }
  .jog .c { position: absolute; left: 78px; top: 78px; width: 80px; height: 80px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--amber); }
  .jog .l { position: absolute; font-size: 12.5px; font-weight: 700; color: var(--ink-3); line-height: 1; transform: translate(-50%, -50%); }
  .set { display: flex; align-items: center; gap: 12px; padding: 11px 14px; flex: 1; min-width: 0; }
  .set .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; color: var(--amber); flex: none; }
  .set .t { font-size: 16.5px; font-weight: 650; white-space: nowrap; } .set .s { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qr { width: 96px; height: 96px; border-radius: 8px; flex: none; display: grid; place-items: center; color: #0D1117; font-size: 11px; font-weight: 700; background-color: #F0F0F0;
    background-image: linear-gradient(45deg, #0D1117 25%, transparent 25%, transparent 75%, #0D1117 75%), linear-gradient(45deg, #0D1117 25%, transparent 25%, transparent 75%, #0D1117 75%);
    background-size: 12px 12px; background-position: 0 0, 6px 6px; }
  .qr span { background: #F0F0F0; padding: 2px 6px; border-radius: 4px; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
  .opt .t { font-size: 17.5px; font-weight: 650; } .opt .s { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
  .opt.pick { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
</style>
</head>
<body>
<div class="gallery" id="root"></div>
<script>
const LOGO = `<rect x="50" y="150" width="200" height="190" fill="#F0F0F0"/><ellipse cx="150" cy="340" rx="100" ry="32" fill="#F0F0F0"/><path d="M50,190 Q150,220 250,190" stroke="#F2B05A" stroke-width="7" fill="none" opacity="0.95"/><path d="M50,300 Q150,330 250,300" stroke="#F2B05A" stroke-width="7" fill="none" opacity="0.95"/><ellipse cx="150" cy="150" rx="100" ry="32" fill="#F2B05A" stroke="#0D1117" stroke-width="6"/><ellipse cx="150" cy="150" rx="34" ry="11" fill="#E39A3E"/><rect x="136" y="70" width="28" height="82" fill="#F0F0F0" stroke="#0D1117" stroke-width="5"/><rect x="88" y="34" width="124" height="38" fill="#A93C4B"/><ellipse cx="150" cy="72" rx="62" ry="19" fill="#A93C4B"/><ellipse cx="150" cy="34" rx="62" ry="19" fill="#C84A5A" stroke="#0D1117" stroke-width="5"/><path d="M150,392 C164,412 180,428 180,444 A30,28 0 0 1 120,444 C120,428 136,412 150,392 Z" fill="#F2B05A" stroke="#0D1117" stroke-width="5"/><g transform="translate(370,15)"><polygon points="0,0 68,0 105.0,128 142,0 210,0 145.0,200 65.0,200" fill="#F0F0F0" /><polygon points="297.0,0 385.0,0 448,200 234,200" fill="#F0F0F0" /><polygon points="341.0,72 381.0,170 301.0,170" fill="#C84A5A" /><polygon points="472,0 538,0 538,140 642,140 642,200 472,200" fill="#F0F0F0" /><polygon points="666,0 734,0 771.0,128 808,0 876,0 811.0,200 731.0,200" fill="#F0F0F0" /><polygon points="900,0 1070,0 1070,50 966,50 966,77 1056,77 1056,123 966,123 966,150 1070,150 1070,200 900,200" fill="#F0F0F0" /></g><g transform="translate(370,255)"><path d="M88.0,0 C128.0,50 176,98 176,132 A88.0,74.0 0 0 1 0,132 C0,98 48.0,50 88.0,0 Z" fill="#F0F0F0"/><path d="M88.0,78 C104.0,100 126,118 126,136 A38.0,34.0 0 0 1 50,136 C50,118 72.0,100 88.0,78 Z" fill="#F2B05A"/><rect x="200" y="0" width="66" height="200" fill="#F0F0F0"/><polygon points="290,0 356,0 356,140 460,140 460,200 290,200" fill="#F0F0F0" /></g>`;
const mark = `<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="40 8 220 470">${LOGO}</svg>`;
const fullLogo = (h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 1440 490" style="height:${h}px">${LOGO}</svg>`;
const P = {
  home: `<path d="M3 11.5l9-8 9 8"/><path d="M5 10v9.5a.5.5 0 0 0 .5.5H10v-6h4v6h4.5a.5.5 0 0 0 .5-.5V10"/>`,
  files: `<path d="M3 6.5a1 1 0 0 1 1-1h5l2 2.5h9a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>`,
  box: `<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>`,
  move: `<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>`,
  gear: `<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>`,
  nozzle: `<path d="M7.5 3.5h9v6.5l-3 4h-3l-3-4z"/><path d="M12 17.5v3"/>`,
  bed: `<path d="M3 16.5h18M6 16.5v3M18 16.5v3"/><path d="M7.5 12.5c0-2 1.5-2 1.5-4s-1.5-2-1.5-4M12 12.5c0-2 1.5-2 1.5-4s-1.5-2-1.5-4M16.5 12.5c0-2 1.5-2 1.5-4s-1.5-2-1.5-4"/>`,
  chamber: `<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M9 16c0-2 1.5-2 1.5-4S9 10 9 8M14 16c0-2 1.5-2 1.5-4S14 10 14 8"/>`,
  fan: `<circle cx="12" cy="12" r="2"/><path d="M12 10c-1-3 .5-6.5 3.5-6.5 2 0 2.5 2.5 1 4-1 1-2.5 1.5-4.5 2.5zM14 12c3-1 6.5.5 6.5 3.5 0 2-2.5 2.5-4 1-1-1-1.5-2.5-2.5-4.5zM12 14c1 3-.5 6.5-3.5 6.5-2 0-2.5-2.5-1-4 1-1 2.5-1.5 4.5-2.5zM10 12c-3 1-6.5-.5-6.5-3.5 0-2 2.5-2.5 4-1 1 1 1.5 2.5 2.5 4.5z"/>`,
  light: `<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.800 1-2.5A6 6 0 0 0 12 3z"/>`,

const I = (n, st = "") => `<svg class="i" viewBox="0 0 24 24" style="${st}">${P[n]}</svg>`;

const sw = (c, s = 22) => `<span class="sw" style="background:${c};width:${s}px;height:${s}px;border-radius:${s / 2}px"></span>`;

function thumb(size, color, kind = 0) {

  return `<div class="thumb" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100" width="${size * .86}" height="${size * .86}"><ellipse cx="50" cy="78" rx="40" ry="12" fill="#000" opacity=".28"/>${parts}</svg></div>`;

        <div class="card" style="padding:2px 14px">${[["nozzle", "Nozzle", "212", "250"], ["bed", "Bed", "58", "80"], ["chamber", "Chamber", "34", "45"]].map(([ic, l, c, t]) => `<div class="kv" style="padding:10px 0"><span class="amber">${I(ic)}</span><span style="width:98px;font-size:17.5px;font-weight:650">${l}</span><span style="font-size:27px;font-weight:700;width:86px">${c}°</span><span class="muted" style="flex:1;font-size:15px">heating</span><span class="pm">−</span><span style="width:74px;text-align:center;font-size:23px;font-weight:700" class="amber">${t}°</span><span class="pm">+</span></div>`).join("")}</div>`) },
    { id: "13-move", cap: "<b>Move.</b> Jog pad for X and Y with Z beside it. Home each axis on its own or all at once; Home Z homes X and Y first when they aren't. Z up means the bed moves toward the nozzle: the Z arrows and the two Z buttons send the bed up near the nozzle or all the way down, 10 mm short of max Z.",
      html: frame("move", `${topbar("Move", { right: `<div class="seg" style="margin-right:8px"><span class="on">Move</span><span>Heat</span><span>Fans</span></div>` })}
        <div class="rowf" style="gap:18px;align-items:flex-start">
          <div class="jog"><span class="a" style="left:88px;top:8px">${I("up")}</span><span class="a" style="left:88px;bottom:8px">${I("down")}</span><span class="a" style="left:8px;top:88px">${I("left")}</span><span class="a" style="right:8px;top:88px">${I("chev")}</span><span class="c">${I("home", "width:30px;height:30px")}</span><span class="l" style="left:118px;top:66px">Y</span><span class="l" style="left:170px;top:118px">X</span></div>
          <div style="display:flex;flex-direction:column;gap:10px;align-items:center"><span class="pm" style="width:66px;height:74px">${I("up")}</span><span class="dim" style="font-size:13px;font-weight:700">Z</span><span class="pm" style="width:66px;height:74px">${I("down")}</span></div>
          <div style="flex:1;min-width:0"><div class="card" style="padding:2px 14px">${[["X", "195.0", 1], ["Y", "", 0], ["Z", "", 0]].map(([a, v, h]) => `<div class="kv" style="padding:7px 0"><span class="k" style="width:28px;font-weight:700">${a}</span><span style="flex:1;text-align:right;font-size:${h ? 19 : 15}px;font-weight:650" class="${h ? "" : "dim"}">${h ? `${v}<span class="dim" style="font-size:14px;margin-left:4px">mm</span>` : "not homed"}</span></div>`).join("")}</div>
            <div class="rowf" style="margin-top:10px;gap:8px">${[["Home X"], ["Home Y"], ["Home Z"], ["Home all"]].map(([t, sub, off]) => `<div class="btn" style="height:50px;font-size:15px;padding:0 4px;flex-direction:column;gap:1px;${off ? "opacity:.45" : ""}">${t}${sub ? `<span style="font-size:11.5px;font-weight:500" class="muted">${sub}</span>` : ""}</div>`).join("")}</div>

const root = document.getElementById("root");
const want = new URLSearchParams(location.search).get("s");
const all = groups.flatMap((g) => g[1]);
if (want) {
  document.body.classList.add("single");
  root.innerHTML = `<div class="screen">${all.find((x) => x.id === want).html}</div>`;
} else {
  root.innerHTML = `<h1>Valve Oil touchscreen: concept mockups</h1><p class="lead">A concept for a touchscreen app in place of QIDI's, at the real 800×480 size of the Max 4 and Plus 5 screens. File names, temperatures, times, and addresses are placeholders, and nothing here is built.</p>` +
    groups.map(([name, list]) => `<h2>${name}</h2><div class="grid">${list.map((s) => `<figure><div class="screen">${s.html}</div><figcaption>${s.cap}</figcaption></figure>`).join("")}</div>`).join("");
}
// The sleep screen's logo bounces around the screen, changing the wordmark's color at each bounce.
for (const el of document.querySelectorAll("[data-bounce]")) {
  const scr = el.closest(".screen"), ink = [...el.querySelectorAll('g [fill="#F0F0F0"]')];
  const colors = ["#F0F0F0", "#F2B05A", "#62C28E", "#6FB3F2", "#F08A97"];
  let x = 150, y = 70, dx = 1.4, dy = 1.1, c = 0;
  const step = () => {
    const W = scr.clientWidth - el.offsetWidth, H = scr.clientHeight - 120 - el.offsetHeight;
    x += dx; y += dy; let hit = false;
    if (x <= 0 || x >= W) { dx = -dx; x = Math.max(0, Math.min(W, x)); hit = true; }
    if (y <= 0 || y >= H) { dy = -dy; y = Math.max(0, Math.min(H, y)); hit = true; }
    if (hit) { c = (c + 1) % colors.length; ink.forEach((p) => p.setAttribute("fill", colors[c])); }
    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
